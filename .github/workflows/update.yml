name: Update Steam Protobufs

on:
  schedule:
    # Weekdays: check every 3 hours during business hours (PST).
    # Offset to :37 to avoid contention with other cron workflows.
    - cron: "37 9,12,15,18,21 * * MON-FRI"
    # Weekends: check twice a day.
    - cron: "37 0,12 * * SAT,SUN"
  workflow_dispatch:

concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    name: Check & Update
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - uses: actions/checkout@v6

      # ── 2. Rust toolchain ────────────────────────────────────────────────────
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # ── 3. Download Steam client binaries from Valve's CDN ───────────────────
      - name: Download Steam binaries
        run: |
          set -euo pipefail

          MANIFEST_URL="https://client-update.fastly.steamstatic.com/steam_client_publicbeta_ubuntu12"
          CDN_BASE="https://client-update.fastly.steamstatic.com"

          echo "Fetching Steam client manifest..."
          MANIFEST=$(curl -sL "$MANIFEST_URL")

          BINS_FILE=$(echo "$MANIFEST" | grep -A3 '"bins_ubuntu12"' | grep '"file"' | awk -F'"' '{print $4}')

          if [[ -z "$BINS_FILE" ]]; then
            echo "ERROR: Could not find bins_ubuntu12 entry in manifest" >&2
            exit 1
          fi

          DOWNLOAD_URL="${CDN_BASE}/${BINS_FILE}"
          TEMP_DIR=$(mktemp -d)

          echo "Downloading ${BINS_FILE}..."
          curl -sL --progress-bar -o "${TEMP_DIR}/bins.zip" "$DOWNLOAD_URL"

          echo "Extracting steamclient.so and steamui.so..."
          mkdir -p steam_bins
          unzip -o -j "${TEMP_DIR}/bins.zip" "ubuntu12_32/steamclient.so" "ubuntu12_32/steamui.so" -d steam_bins

          rm -rf "$TEMP_DIR"

          for BIN in steamclient.so steamui.so; do
            if [[ -f "steam_bins/${BIN}" ]]; then
              SIZE=$(du -h "steam_bins/${BIN}" | cut -f1)
              echo "  ✓ ${BIN} (${SIZE})"
            else
              echo "  ✗ ${BIN} not found" >&2
              exit 1
            fi
          done

      # ── 4. Download steam-protobuf-dumper from GitHub Releases ───────────────
      - name: Download dumper
        run: |
          set -euo pipefail

          echo "Fetching latest steam-protobuf-dumper release..."
          DOWNLOAD_URL=$(curl -sL \
            "https://api.github.com/repos/enXov/steam-protobuf-dumper/releases/latest" \
            | grep -o '"browser_download_url": *"[^"]*x86_64-unknown-linux-gnu[^"]*"' \
            | head -1 \
            | cut -d'"' -f4)

          if [[ -z "$DOWNLOAD_URL" ]]; then
            echo "ERROR: Could not find linux release asset" >&2
            exit 1
          fi

          echo "Downloading from ${DOWNLOAD_URL}..."
          curl -sL -o dumper.tar.gz "$DOWNLOAD_URL"
          tar xzf dumper.tar.gz
          chmod +x steam-protobuf-dumper
          rm dumper.tar.gz

          echo "  ✓ steam-protobuf-dumper ready"

      # ── 5. Run dumper to extract .proto files ────────────────────────────────
      - name: Extract protos
        run: |
          ./steam-protobuf-dumper steam_bins/steamclient.so steam_bins/steamui.so protos/

      # ── 6. Check for proto changes ──────────────────────────────────────────
      # The dumper produces valid proto files but with non-deterministic field
      # ordering. Every run shuffles the same content into a different line
      # order, so `git diff` always sees false "changes". We normalize by
      # sorting each file's lines before hashing - only real semantic changes
      # (new fields, removed messages, changed values) trigger a rebuild.
      - name: Detect proto changes
        id: diff
        run: |
          set -euo pipefail

          # Normalized hash: sort filenames, then sort lines within each file.
          # This makes the hash insensitive to line ordering.
          normalize_hash() {
            find "$1" -name "*.proto" | sort | while IFS= read -r f; do
              echo "=== $(basename "$f") ==="
              sort "$f"
            done | sha256sum | cut -d' ' -f1
          }

          # Save the dumped protos aside
          cp -r protos/ /tmp/new_protos/

          # Hash of committed (pre-dump) protos
          git checkout -- protos/
          HASH_OLD=$(normalize_hash protos/)

          # Restore dumped protos
          rm -rf protos/
          cp -r /tmp/new_protos/ protos/
          HASH_NEW=$(normalize_hash protos/)

          echo "Old hash: ${HASH_OLD}"
          echo "New hash: ${HASH_NEW}"

          if [[ "$HASH_OLD" == "$HASH_NEW" ]]; then
            echo "No semantic protobuf changes (ordering differences only)."
            git checkout -- protos/
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Real protobuf changes detected!"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # ── 7. Install protoc (required by prost-build) ─────────────────────────
      - name: Install protoc
        if: steps.diff.outputs.changed == 'true'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # ── 8. Regenerate Rust types ─────────────────────────────────────────────
      - name: Generate Rust types
        if: steps.diff.outputs.changed == 'true'
        run: |
          cargo build --features codegen
          cargo fmt

      # ── 9. Update metadata ──────────────────────────────────────────────────
      - name: Bump version & metadata
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail

          # Read current version
          CURRENT=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "Current version: ${CURRENT}"

          # Bump patch version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          echo "New version: ${NEW_VERSION}"

          # Update Cargo.toml version
          sed -i "s/^version = \"${CURRENT}\"/version = \"${NEW_VERSION}\"/" Cargo.toml

          # Update metadata constants in src/lib.rs
          DATE=$(date -u +%Y-%m-%d)
          sed -i "s/^pub const STEAM_BUILD:.*$/pub const STEAM_BUILD: \&str = \"${NEW_VERSION}\";/" src/lib.rs
          sed -i "s/^pub const GENERATED_AT:.*$/pub const GENERATED_AT: \&str = \"${DATE}\";/" src/lib.rs

          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      # ── 10. Validate ─────────────────────────────────────────────────────────
      - name: Validate
        if: steps.diff.outputs.changed == 'true'
        run: |
          cargo fmt --check
          cargo check
          cargo package --allow-dirty

      # ── 11. Commit, tag, publish ────────────────────────────────────────────
      - name: Commit & publish
        if: steps.diff.outputs.changed == 'true'
        env:
          CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          set -euo pipefail

          NEW_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add protos/ src/generated/ Cargo.toml Cargo.lock src/lib.rs
          git commit -m "chore: update Steam protobufs to v${NEW_VERSION}"
          git tag "v${NEW_VERSION}"
          git push origin main --tags

          cargo publish --token "$CRATES_IO_TOKEN" --allow-dirty
