name: Update Steam Protobufs

on:
  schedule:
    # Weekdays: check every 3 hours during business hours (PST).
    # Offset to :37 to avoid contention with other cron workflows.
    - cron: "37 9,12,15,18,21 * * MON-FRI"
    # Weekends: check twice a day.
    - cron: "37 0,12 * * SAT,SUN"
  workflow_dispatch:

concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    name: Check & Update
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - uses: actions/checkout@v6

      # ── 2. Rust toolchain ────────────────────────────────────────────────────
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # ── 3. Download Steam client binaries from Valve's CDN ───────────────────
      - name: Download Steam binaries
        run: |
          set -euo pipefail

          MANIFEST_URL="https://client-update.fastly.steamstatic.com/steam_client_publicbeta_ubuntu12"
          CDN_BASE="https://client-update.fastly.steamstatic.com"

          echo "Fetching Steam client manifest..."
          MANIFEST=$(curl -sL "$MANIFEST_URL")

          BINS_FILE=$(echo "$MANIFEST" | grep -A3 '"bins_ubuntu12"' | grep '"file"' | awk -F'"' '{print $4}')

          if [[ -z "$BINS_FILE" ]]; then
            echo "ERROR: Could not find bins_ubuntu12 entry in manifest" >&2
            exit 1
          fi

          DOWNLOAD_URL="${CDN_BASE}/${BINS_FILE}"
          TEMP_DIR=$(mktemp -d)

          echo "Downloading ${BINS_FILE}..."
          curl -sL --progress-bar -o "${TEMP_DIR}/bins.zip" "$DOWNLOAD_URL"

          echo "Extracting steamclient.so and steamui.so..."
          mkdir -p steam_bins
          unzip -o -j "${TEMP_DIR}/bins.zip" "ubuntu12_32/steamclient.so" "ubuntu12_32/steamui.so" -d steam_bins

          rm -rf "$TEMP_DIR"

          for BIN in steamclient.so steamui.so; do
            if [[ -f "steam_bins/${BIN}" ]]; then
              SIZE=$(du -h "steam_bins/${BIN}" | cut -f1)
              echo "  ✓ ${BIN} (${SIZE})"
            else
              echo "  ✗ ${BIN} not found" >&2
              exit 1
            fi
          done

      # ── 4. Download steam-protobuf-dumper from GitHub Releases ───────────────
      - name: Download dumper
        run: |
          set -euo pipefail

          echo "Fetching latest steam-protobuf-dumper release..."
          DOWNLOAD_URL=$(curl -sL \
            "https://api.github.com/repos/enXov/steam-protobuf-dumper/releases/latest" \
            | grep -o '"browser_download_url": *"[^"]*x86_64-unknown-linux-gnu[^"]*"' \
            | head -1 \
            | cut -d'"' -f4)

          if [[ -z "$DOWNLOAD_URL" ]]; then
            echo "ERROR: Could not find linux release asset" >&2
            exit 1
          fi

          echo "Downloading from ${DOWNLOAD_URL}..."
          curl -sL -o dumper.tar.gz "$DOWNLOAD_URL"
          tar xzf dumper.tar.gz
          chmod +x steam-protobuf-dumper
          rm dumper.tar.gz

          echo "  ✓ steam-protobuf-dumper ready"

      # ── 5. Run dumper to extract .proto files ────────────────────────────────
      - name: Extract protos
        run: |
          ./steam-protobuf-dumper steam_bins/steamclient.so steam_bins/steamui.so protos/

      # ── 6. Normalize & detect proto changes ─────────────────────────────────
      # The dumper shuffles declaration order (fields, messages, enums)
      # non-deterministically on every run. We use:
      #   1. buf format  → canonical formatting (whitespace, imports)
      #   2. sorted-line hash → content comparison ignoring declaration order
      #
      # Baseline is extracted via `git archive HEAD` into a temp dir so that
      # untracked files from the dumper never leak into HASH_OLD.
      - name: Detect proto changes
        id: diff
        run: |
          set -euo pipefail

          # Install buf CLI
          curl -sSL \
            "https://github.com/bufbuild/buf/releases/latest/download/buf-Linux-x86_64" \
            -o /usr/local/bin/buf
          chmod +x /usr/local/bin/buf
          echo "  ✓ buf $(buf --version)"

          # Format freshly dumped protos
          buf format -w protos/

          # Temporary snapshots — cleaned up on exit
          OLD_DIR=$(mktemp -d)
          NEW_DIR=$(mktemp -d)
          cleanup() { rm -rf "$OLD_DIR" "$NEW_DIR"; }
          trap cleanup EXIT

          # NEW = freshly dumped + formatted
          cp -a protos/. "$NEW_DIR/"

          # OLD = exact state committed at HEAD (no untracked file leaks)
          if git ls-tree -d --name-only HEAD protos/ 2>/dev/null | grep -qx 'protos'; then
            git archive HEAD -- protos/ | tar -x -C "$OLD_DIR"
            # Normalize old files with the same formatter for fair comparison
            buf format -w "$OLD_DIR/protos/"
          fi

          # Sorted-content hash: sorts lines within each file before hashing,
          # making the comparison insensitive to declaration ordering.
          # Includes relative file path to detect added/removed files.
          content_hash() {
            local dir="$1"
            if [[ ! -d "$dir" ]]; then
              printf 'empty\n' | sha256sum | cut -d' ' -f1
              return
            fi
            if ! find "$dir" -type f -name '*.proto' -print -quit | grep -q .; then
              printf 'empty\n' | sha256sum | cut -d' ' -f1
              return
            fi
            find "$dir" -type f -name '*.proto' -print0 \
              | sort -z \
              | while IFS= read -r -d '' file; do
                  rel="${file#"$dir"/}"
                  printf '=== FILE: %s ===\n' "$rel"
                  sort "$file"
                done \
              | sha256sum \
              | cut -d' ' -f1
          }

          HASH_OLD="$(content_hash "$OLD_DIR/protos")"
          HASH_NEW="$(content_hash "$NEW_DIR")"

          echo "Committed hash: $HASH_OLD"
          echo "Dumped hash:    $HASH_NEW"

          if [[ "$HASH_OLD" == "$HASH_NEW" ]]; then
            echo "No protobuf content changes (ordering differences only)."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Real protobuf changes detected!"
            # Keep freshly dumped + formatted protos for code generation
            rm -rf protos
            mkdir -p protos
            cp -a "$NEW_DIR"/. protos/
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo
            echo "Changed files:"
            git status --short protos/
          fi

      # ── 7. Install protoc (required by prost-build) ─────────────────────────
      - name: Install protoc
        if: steps.diff.outputs.changed == 'true'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # ── 8. Regenerate Rust types ─────────────────────────────────────────────
      - name: Generate Rust types
        if: steps.diff.outputs.changed == 'true'
        run: |
          cargo build --features codegen
          cargo fmt

      # ── 9. Update metadata ──────────────────────────────────────────────────
      - name: Bump version & metadata
        id: version
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail

          # Read current version
          CURRENT=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "Current version: ${CURRENT}"

          # Bump patch version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          echo "New version: ${NEW_VERSION}"

          # Update Cargo.toml version
          sed -i "s/^version = \"${CURRENT}\"/version = \"${NEW_VERSION}\"/" Cargo.toml

          # Update metadata constants in src/lib.rs
          DATE=$(date -u +%Y-%m-%d)
          sed -i "s/^pub const STEAM_BUILD:.*$/pub const STEAM_BUILD: \&str = \"${NEW_VERSION}\";/" src/lib.rs
          sed -i "s/^pub const GENERATED_AT:.*$/pub const GENERATED_AT: \&str = \"${DATE}\";/" src/lib.rs

          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      # ── 10. Validate ─────────────────────────────────────────────────────────
      - name: Validate
        if: steps.diff.outputs.changed == 'true'
        run: |
          cargo fmt --check
          cargo check
          cargo package --allow-dirty

      # ── 11. Commit, tag, publish ────────────────────────────────────────────
      - name: Commit & publish
        if: steps.diff.outputs.changed == 'true'
        env:
          CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          set -euo pipefail

          NEW_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add protos/ src/generated/ Cargo.toml Cargo.lock src/lib.rs
          git commit -m "chore: update Steam protobufs to v${NEW_VERSION}"
          git tag "v${NEW_VERSION}"
          git push origin main --tags

          cargo publish --token "$CRATES_IO_TOKEN" --allow-dirty
