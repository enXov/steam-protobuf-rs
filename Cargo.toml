[package]
name = "steam-protobuf-rs"
version = "0.1.11"
edition = "2024"
description = "Auto-updated, type-safe Steam Protobuf definitions for Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/enXov/steam-protobuf-rs"
readme = "README.md"
keywords = ["steam", "protobuf", "valve", "steamkit", "prost"]
categories = ["encoding", "game-development"]
# Only ship what end users need. protos/, .github/, and build.rs
# (codegen-only) stay in the repo but don't bloat the crate.
include = ["src/**", "build.rs", "LICENSE-*", "README.md"]

[features]
default = []
# Enable to regenerate Rust types from protos/ via prost-build.
# Only used in CI and local dev — end users never need this.
codegen = ["dep:prost-build"]

[dependencies]
prost = "0.14"
prost-types = "0.14"

[build-dependencies]
prost-build = { version = "0.14", optional = true }

# ─── Lint configuration ──────────────────────────────────────────────────────

[lints.rust]
# Surface unused and unsafe code at build time. This crate is 100% safe Rust
# (all code is generated by prost); `unsafe_code = "deny"` documents that intent.
unsafe_code = "deny"
unused_imports = "warn"

[lints.clippy]
# Lints that catch real bugs or runtime panics that rustc itself allows:
dbg_macro              = "deny"   # leftover dbg!() must never ship
print_stdout           = "deny"   # stdout in a library crate is impolite
print_stderr           = "deny"
todo                   = "deny"   # leftover TODOs must never ship
unwrap_used            = "warn"   # Result::unwrap() can panic — use .context()? or expect()
unreachable            = "warn"   # confirms unreachable branches stay unreachable
needless_pass_by_value = "warn"   # perf hint: avoid cloning args unnecessarily
clone_on_ref_ptr       = "warn"   # accidental expensive clone of Arc/Rc
explicit_counter_loop  = "warn"   # prefer .iter().enumerate() over manual indexing
manual_strip           = "warn"   # use str::strip_prefix / strip_suffix
string_lit_as_bytes    = "warn"   # use b"..." instead of "...".as_bytes()
single_match_else      = "warn"   # preferational — usually clearer than `if`

# ─── Release profile — optimized for SPEED ───────────────────────────────────

[profile.release]
lto = "fat"            # cross-crate LTO across deps + local crates (slow link, fast runtime)
codegen-units = 1      # single codegen unit — slower compile, best optimization
opt-level = 3          # optimize for SPEED (inlining + vectorization)
panic = "abort"        # no unwind tables — smaller binary, faster panic path
strip = "symbols"      # strip debug symbols from final binary
debug = 0              # no debuginfo in release — saves space and link time
